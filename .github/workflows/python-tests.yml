name: Validacoes Python

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Validar sintaxe
        run: python -m compileall -q emissor emitir.py verificar_certificado.py validar_homologacao.py verificar_conexao_restrita.py transmitir_teste_restrito.py
      - name: Executar testes
        run: python -m unittest discover -s tests -v
      - name: Validar exemplo publico
        run: |
          python - <<'PY'
          from emissor.core import carrega_clientes
          clients = carrega_clientes("config/clientes.exemplo.json")
          assert len(clients) == 8
          print("Cadastro ficticio: 8 registros validos")
          PY
